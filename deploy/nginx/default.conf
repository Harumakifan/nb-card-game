# CardForge · nginx：静态资源（dist/）+ /ws 反向代理到 Node 对战服务器（容器 server:8787）
limit_req_zone $binary_remote_addr zone=cf_art:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=cf_ws:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=cf_wsconn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream cardforge_server {
    server server:8787;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # 真实客户端 IP（限流按真实 IP 计数）。
    # cloudflared 在宿主机上连接 127.0.0.1:8080，经 Docker 端口映射进入容器后，nginx 看到的来源是
    # Docker 网桥网关（172.16.0.0/12 等），并不是 127.0.0.1——旧配置只信任 127.0.0.1，
    # 导致 CF-Connecting-IP 从未生效、所有玩家共用同一个限流额度。
    # 安全前提：宿主机端口只绑定在 127.0.0.1（docker-compose 默认 BIND=127.0.0.1），外部无法直连伪造该请求头。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    include /etc/nginx/snippets/cardforge-common-headers.conf;
    include /etc/nginx/snippets/cardforge-csp.conf;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 64k;

    # 构建时已生成 .gz（gzip -9 / brotli 由 Node 静态服务使用）；未预压缩的再做实时 gzip
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 对战服务器（WebSocket）
    location = /ws {
        limit_req zone=cf_ws burst=10 nodelay;
        limit_conn cf_wsconn 12;
        proxy_pass http://cardforge_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 带内容哈希的脚本 / 样式 / 清单：内容变了文件名就变，可以永久缓存
    location ~* "\.[0-9a-f]{12}\.(js|css|json|map)$" {
        include /etc/nginx/snippets/cardforge-common-headers.conf;
        include /etc/nginx/snippets/cardforge-csp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 卡图（文件名即内容哈希）：按需加载 + 永久缓存；按真实 IP 适度限流
    location /art/ {
        limit_req zone=cf_art burst=300 nodelay;
        include /etc/nginx/snippets/cardforge-common-headers.conf;
        include /etc/nginx/snippets/cardforge-csp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 卡牌设计器以同源 iframe 嵌入主页面：仅它允许被同源页面嵌入
    location = /designer.html {
        include /etc/nginx/snippets/cardforge-common-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/cardforge-common-headers.conf;
        include /etc/nginx/snippets/cardforge-csp.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
