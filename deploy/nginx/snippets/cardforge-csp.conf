# 严格 CSP：脚本只允许同源文件；WebSocket 只连同源 /ws（不再放行任何第三方 MQTT 代理）
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
